; GTX335 custom firmware for Raspberry Pi Pico / RP2040.

[env_gtx335]
build_flags =
	${env.build_flags}
	-DMF_CUSTOMDEVICE_SUPPORT=1
	-DMF_CUSTOMDEVICE_HAS_UPDATE
	-DMF_CUSTOMDEVICE_POLL_MS=10
	-DHAS_CONFIG_IN_FLASH
	-I./src/src/MF_CustomDevice
	-I./GTX335
build_src_filter =
	+<../GTX335>
	-<src/MF_Button/Button.cpp>
lib_deps =
	olikraus/U8g2 @ ^2.36.5
custom_core_firmware_version = 3.0.0
custom_source_folder = GTX335
custom_community_project = GTX335
custom_zip_filename = GTX335
custom_deploy_community_dir = ~/AppData/Local/MobiFlight/MobiFlight Connector/Community

[env:jh_gtx335]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0M
lib_ldf_mode = chain+
upload_protocol = mbed
build_flags =
	${env_gtx335.build_flags}
	'-DMOBIFLIGHT_TYPE="JH GTX335"'
	'-DMOBIFLIGHT_NAME="JH GTX335"'
	-DMEMLEN_CONFIG=1496
	-DMEMLEN_NAMES_BUFFER=1000
	-DMF_MAX_DEVICEMEM=1000
build_src_filter =
	${env.build_src_filter}
	${env_gtx335.build_src_filter}
lib_deps =
	${env.lib_deps}
	${env.custom_lib_deps_Pico}
	${env_gtx335.lib_deps}
monitor_speed = 115200
extra_scripts =
	${env.extra_scripts}
custom_core_firmware_version = ${env_gtx335.custom_core_firmware_version}
custom_community_project = ${env_gtx335.custom_community_project}
custom_source_folder = ${env_gtx335.custom_source_folder}
custom_zip_filename = ${env_gtx335.custom_zip_filename}
custom_deploy_community_dir = ${env_gtx335.custom_deploy_community_dir}
